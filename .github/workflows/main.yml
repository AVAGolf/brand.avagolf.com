name: Deploy to S3
on:
  push:
    branches:
      - main
jobs:
  # Converge infrastructure (Fastly, S3, Cloudflare) BEFORE the site is
  # published. Gating the deploy on this is deliberate: the Fastly
  # canonical-URL snippets and the segmented-caching rule for the brand-pack
  # downloads both live in Terraform, so a push that syncs pages without
  # applying them ships the content but not the routing that serves it.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.5'
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: infrastructure/terraform
        env:
          # aws_profile is forced empty so the provider uses the OIDC env creds.
          # terraform.tfvars, which sets it to "ava-prod" for local runs, is
          # gitignored and absent in CI.
          TF_VAR_aws_profile: ''
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_email: ${{ secrets.CLOUDFLARE_EMAIL }}
          TF_VAR_fastly_api_token: ${{ secrets.FASTLY_API_TOKEN }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: infrastructure/terraform
        env:
          TF_VAR_aws_profile: ''
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_email: ${{ secrets.CLOUDFLARE_EMAIL }}
          TF_VAR_fastly_api_token: ${{ secrets.FASTLY_API_TOKEN }}
        run: terraform apply -input=false tfplan

  deploy:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - uses: jakejarvis/s3-sync-action@master
        with:
          # files/* binaries are uploaded out-of-band (manual / scripts/sync-files.mjs)
          # and must survive the --delete sync; they are not in git.
          args: --acl public-read --follow-symlinks --delete --exclude 'files/*'
        env:
          AWS_S3_BUCKET: brand.avagolf.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.S3_BUCKET_REGION }}
          SOURCE_DIR: 'dist/'

      - name: Invalidate Fastly
        uses: jcoene/fastly-purge-action@master
        with:
          api_key: "${{ secrets.FASTLY_API_KEY }}"
          service_id: "iN42g1xAhUJCEMKjylOpRW"

      - name: Purge Cloudflare Cache
        uses: nathanvaughn/actions-cloudflare-purge@master
        with:
          cf_zone: "e690f4cbe14dc74233ccb7b3a76749cc"
          cf_auth: ${{ secrets.CLOUDFLARE_PURGE_CACHE_API }}
